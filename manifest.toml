#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2
id = "arcenal-portail"
name = "ARCenal Portail"
description.fr = "Portail d'accueil ARCenal pour vos services sélectionnés."
description.en = "ARCenal welcome portal for your selected services."
version = "0.1.3~ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenal-portail_ynh"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "2M"
ram.build = "10M"
ram.runtime = "10M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arcenal"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.install_dir]
    owner = "root:rwx"
    group = "www-data:rx"

    [resources.permissions]
    main.url = "/"
